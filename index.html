<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人数据生活仪表盘</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 开场加载界面（含烟花、横幅和跳过提示） -->
  <div id="loader" class="loader-container">
    <div class="fireworks">
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
    </div>
    <div class="banner">
      <h1>你好，我是侯若轩！</h1>
      <p class="skip-hint">点击任意位置跳过</p>
    </div>
  </div>

  <div class="dashboard">
    <header class="header">
      <div>
        <h1>个人数据生活仪表盘</h1>
        <div id="realtime-info" class="realtime-info">
          <span id="weather-box">🌤️ 正在获取天气...</span>
          <span id="steps-box">👟 正在获取步数...</span>
          <span id="exercise-box">🏃 运动时间: -- 分钟</span>
        </div>
      </div>
      <button id="theme-toggle" class="btn">切换暗色模式</button>
    </header>
    
    <div class="grid-container">
      <div class="card">
        <h3>每日步数趋势</h3>
        <div id="chart-steps" class="chart-container"></div>
      </div>
      <div class="card">
        <h3>今日时间分配</h3>
        <div id="chart-sleep" class="chart-container"></div>
      </div>

      <div class="card card-horoscope">
        <div class="card-header-flex">
          <h3>🔮 今日星座运势</h3>
          <select id="sign-select" class="sign-select">
            <option value="aries">白羊座</option>
            <option value="taurus">金牛座</option>
            <option value="gemini">双子座</option>
            <option value="cancer">巨蟹座</option>
            <option value="leo">狮子座</option>
            <option value="virgo">处女座</option>
            <option value="libra">天秤座</option>
            <option value="scorpio">天蝎座</option>
            <option value="sagittarius">射手座</option>
            <option value="capricorn">摩羯座</option>
            <option value="aquarius">水瓶座</option>
            <option value="pisces">双鱼座</option>
          </select>
        </div>
        <div id="horoscope-box" class="horoscope-box">
          <span>正在获取星座运势...</span>
        </div>
      </div>

      <div class="card card-almanac">
        <h3>📅 今日黄历</h3>
        <div id="almanac-box" class="almanac-box">
          <span>正在获取黄历...</span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
